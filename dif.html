<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root {
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #e0e0e0;
            --add-bg: #e6ffec;
            --add-text: #24292e;
            --del-bg: #ffeef0;
            --del-text: #24292e;
            --mod-bg: #fffdef;
            --mod-text: #24292e;
            --primary: #0066cc;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 24px;
        }

        .upload-area {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .drop-zone {
            border: 2px dashed #ccc;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            background: var(--card-bg);
            cursor: pointer;
            transition: all 0.2s;
        }

        .drop-zone:hover, .drop-zone.dragover {
            border-color: var(--primary);
            background: #f0f7ff;
        }

        .drop-zone h3 {
            margin-top: 0;
        }

        .drop-zone input[type="file"] {
            display: none;
        }

        .file-info {
            margin-top: 10px;
            font-size: 13px;
            color: #666;
            word-break: break-all;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            background: var(--card-bg);
            padding: 15px 20px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .stats {
            display: flex;
            gap: 15px;
            font-weight: bold;
        }

        .badge {
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 12px;
        }

        .badge-added { background: #dafbe1; color: #1a7f37; }
        .badge-modified { background: #fff8c5; color: #9a6700; }
        .badge-deleted { background: #ffebe9; color: #cf222e; }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        button:hover {
            opacity: 0.9;
        }

        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        .result-table {
            width: 100%;
            border-collapse: collapse;
            background: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .result-table th, .result-table td {
            padding: 10px 15px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
            vertical-align: top;
            font-family: monospace;
            font-size: 13px;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .result-table th {
            background-color: #f1f3f5;
            font-family: sans-serif;
            font-weight: 600;
        }

        tr.row-added { background-color: var(--add-bg); color: var(--add-text); }
        tr.row-deleted { background-color: var(--del-bg); color: var(--del-text); }
        tr.row-modified { background-color: var(--mod-bg); color: var(--mod-text); }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #888;
            background: var(--card-bg);
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }
    </style>
</head>
<body>

<div class="container">

    <div class="upload-area">
        <div class="drop-zone" id="zone-old" onclick="document.getElementById('file-old').click()">
            <h3>1. 選擇舊版 (Old File)</h3>
            <p>拖放 .bytes 檔案至此或點擊上傳</p>
            <input type="file" id="file-old" accept=".bytes">
            <div class="file-info" id="info-old">尚未選擇檔案</div>
        </div>

        <div class="drop-zone" id="zone-new" onclick="document.getElementById('file-new').click()">
            <h3>2. 選擇新版 (New File)</h3>
            <p>拖放 .bytes 檔案至此或點擊上傳</p>
            <input type="file" id="file-new" accept=".bytes">
            <div class="file-info" id="info-new">尚未選擇檔案</div>
        </div>
    </div>

    <div class="controls">
        <div class="stats">
            <span>差異統計：</span>
            <span class="badge badge-added" id="count-added">新增: 0</span>
            <span class="badge badge-modified" id="count-modified">修改: 0</span>
            <span class="badge badge-deleted" id="count-deleted">刪除: 0</span>
        </div>
        <div class="btn-group">
            <button id="btn-export-diff" disabled onclick="exportDiffJSON()">導出差異 JSON</button>
        </div>
    </div>

    <div id="result-container">
        <div class="empty-state" id="empty-state">請在上方的兩個區域上傳新舊版本的 .bytes 檔案進行對比</div>
    </div>
</div>

<script>
    let parsedOld = null;
    let parsedNew = null;
    let currentDiff = [];

    // 設定拖放與上傳監聽
    setupDropZone('zone-old', 'file-old', (data, file) => {
        parsedOld = { data, name: file.name };
        document.getElementById('info-old').innerHTML = `<strong>${file.name}</strong><br>版本: ${data.version} | 項目數: ${Object.keys(data.output).length}`;
        checkAndCompare();
    });

    setupDropZone('zone-new', 'file-new', (data, file) => {
        parsedNew = { data, name: file.name };
        document.getElementById('info-new').innerHTML = `<strong>${file.name}</strong><br>版本: ${data.version} | 項目數: ${Object.keys(data.output).length}`;
        checkAndCompare();
    });

    function setupDropZone(zoneId, inputId, callback) {
        const zone = document.getElementById(zoneId);
        const input = document.getElementById(inputId);

        zone.addEventListener('dragover', (e) => {
            e.preventDefault();
            zone.classList.add('dragover');
        });

        zone.addEventListener('dragleave', () => zone.classList.remove('dragover'));

        zone.addEventListener('drop', (e) => {
            e.preventDefault();
            zone.classList.remove('dragover');
            if (e.dataTransfer.files.length) {
                input.files = e.dataTransfer.files;
                handleFile(e.dataTransfer.files[0], callback);
            }
        });

        input.addEventListener('change', (e) => {
            if (e.target.files.length) {
                handleFile(e.target.files[0], callback);
            }
        });
    }

    function handleFile(file, callback) {
        const reader = new FileReader();
        reader.onload = function(e) {
            const buffer = new Uint8Array(e.target.result);
            const parsed = parseBytes(buffer);
            callback(parsed, file);
        };
        reader.readAsArrayBuffer(file);
    }

    // 將 Python 中的 parseBytes 邏輯移植為 JS ( Varint 讀取 + 鍵值對解碼 )
    function parseBytes(uint8Array) {
        let index = 1;

        function readNumber() {
            let result = 0;
            let offset = 0;
            while (index < uint8Array.length) {
                const byte = uint8Array[index];
                result |= (byte & 0x7f) << offset;
                index++;
                if (byte & 0x80) {
                    offset += 7;
                } else {
                    break;
                }
            }
            return result;
        }

        const dv = readNumber();
        const output = {};
        const decoder = new TextDecoder('utf-8');
        let tempContainer = [];

        while (index < uint8Array.length) {
            const datalen = readNumber();
            if (index + datalen > uint8Array.length) break;
            
            const slice = uint8Array.subarray(index, index + datalen);
            const datavalue = decoder.decode(slice);
            tempContainer.push(datavalue);
            index += datalen;

            if (tempContainer.length === 2) {
                output[tempContainer[0]] = tempContainer[1];
                tempContainer = [];
            }
        }

        return { version: dv, output };
    }

    // 對比舊版與新版
    function checkAndCompare() {
        if (!parsedOld || !parsedNew) return;

        const oldData = parsedOld.data.output;
        const newData = parsedNew.data.output;

        const allKeys = new Set([...Object.keys(oldData), ...Object.keys(newData)]);
        
        currentDiff = [];
        let addedCount = 0;
        let modifiedCount = 0;
        let deletedCount = 0;

        allKeys.forEach(key => {
            const hasOld = key in oldData;
            const hasNew = key in newData;

            if (hasNew && !hasOld) {
                currentDiff.push({ type: 'added', key, oldVal: '', newVal: newData[key] });
                addedCount++;
            } else if (hasOld && !hasNew) {
                currentDiff.push({ type: 'deleted', key, oldVal: oldData[key], newVal: '' });
                deletedCount++;
            } else if (oldData[key] !== newData[key]) {
                currentDiff.push({ type: 'modified', key, oldVal: oldData[key], newVal: newData[key] });
                modifiedCount++;
            }
        });

        // 更新 UI 統計
        document.getElementById('count-added').innerText = `新增: ${addedCount}`;
        document.getElementById('count-modified').innerText = `修改: ${modifiedCount}`;
        document.getElementById('count-deleted').innerText = `刪除: ${deletedCount}`;

        document.getElementById('btn-export-diff').disabled = currentDiff.length === 0;

        renderDiffTable(currentDiff);
    }

    // 渲染差異列表 (僅顯示差異項目)
    function renderDiffTable(diffList) {
        const container = document.getElementById('result-container');

        if (diffList.length === 0) {
            container.innerHTML = `<div class="empty-state">比對完成：新舊版本內容完全一致，無任何差異！</div>`;
            return;
        }

        let html = `
            <table class="result-table">
                <thead>
                    <tr>
                        <th style="width: 10%;">類型</th>
                        <th style="width: 30%;">Key</th>
                        <th style="width: 30%;">舊版內容 (Old)</th>
                        <th style="width: 30%;">新版內容 (New)</th>
                    </tr>
                </thead>
                <tbody>
        `;

        diffList.forEach(item => {
            let typeLabel = '';
            let rowClass = '';

            if (item.type === 'added') {
                typeLabel = '新增 (Add)';
                rowClass = 'row-added';
            } else if (item.type === 'modified') {
                typeLabel = '修改 (Mod)';
                rowClass = 'row-modified';
            } else if (item.type === 'deleted') {
                typeLabel = '刪除 (Del)';
                rowClass = 'row-deleted';
            }

            html += `
                <tr class="${rowClass}">
                    <td><strong>${typeLabel}</strong></td>
                    <td>${escapeHtml(item.key)}</td>
                    <td>${escapeHtml(item.oldVal)}</td>
                    <td>${escapeHtml(item.newVal)}</td>
                </tr>
            `;
        });

        html += `</tbody></table>`;
        container.innerHTML = html;
    }

    // 導出差異為 JSON 檔案
    function exportDiffJSON() {
        if (!currentDiff.length) return;

        const exportData = {
            metadata: {
                oldFile: parsedOld.name,
                newFile: parsedNew.name,
                oldVersion: parsedOld.data.version,
                newVersion: parsedNew.data.version,
                exportedAt: new Date().toISOString()
            },
            diff: currentDiff
        };

        const blob = new Blob([JSON.stringify(exportData, null, 4)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `diff-${parsedOld.data.version}-to-${parsedNew.data.version}.json`;
        a.click();
        URL.revokeObjectURL(url);
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }
</script>

</body>
</html>
