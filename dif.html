<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <style>
        :root {
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #e0e0e0;
            --add-bg: #e6ffec;
            --add-text: #24292e;
            --del-bg: #ffeef0;
            --del-text: #24292e;
            --mod-bg: #fffdef;
            --mod-text: #24292e;
            --primary: #0066cc;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 24px;
        }

        .upload-area {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .drop-zone {
            border: 2px dashed #ccc;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            background: var(--card-bg);
            cursor: pointer;
            transition: all 0.2s;
        }

        .drop-zone:hover, .drop-zone.dragover {
            border-color: var(--primary);
            background: #f0f7ff;
        }

        .drop-zone h3 {
            margin-top: 0;
        }

        .drop-zone input[type="file"] {
            display: none;
        }

        .file-info {
            margin-top: 10px;
            font-size: 13px;
            color: #666;
            word-break: break-all;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            background: var(--card-bg);
            padding: 15px 20px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .stats {
            display: flex;
            gap: 15px;
            font-weight: bold;
            align-items: center;
        }

        .badge {
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 12px;
        }

        .badge-added { background: #dafbe1; color: #1a7f37; }
        .badge-modified { background: #fff8c5; color: #9a6700; }
        .badge-deleted { background: #ffebe9; color: #cf222e; }
        .badge-mode { background: #e1f5fe; color: #0288d1; }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        button:hover {
            opacity: 0.9;
        }

        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        .result-table {
            width: 100%;
            border-collapse: collapse;
            background: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .result-table th, .result-table td {
            padding: 10px 15px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
            vertical-align: top;
            font-family: monospace;
            font-size: 13px;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .result-table th {
            background-color: #f1f3f5;
            font-family: sans-serif;
            font-weight: 600;
        }

        tr.row-added { background-color: var(--add-bg); color: var(--add-text); }
        tr.row-deleted { background-color: var(--del-bg); color: var(--del-text); }
        tr.row-modified { background-color: var(--mod-bg); color: var(--mod-text); }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #888;
            background: var(--card-bg);
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }
    </style>
</head>
<body>

<div class="container">
    <h1></h1>

    <div class="upload-area">
        <div class="drop-zone" id="zone-old" onclick="document.getElementById('file-old').click()">
            <h3>1. 選擇舊版 (Old File)</h3>
            <p>拖放任何檔案至此或點擊上傳</p>
            <input type="file" id="file-old">
            <div class="file-info" id="info-old">尚未選擇檔案</div>
        </div>

        <div class="drop-zone" id="zone-new" onclick="document.getElementById('file-new').click()">
            <h3>2. 選擇新版 (New File)</h3>
            <p>拖放任何檔案至此或點擊上傳</p>
            <input type="file" id="file-new">
            <div class="file-info" id="info-new">尚未選擇檔案</div>
        </div>
    </div>

    <div class="controls">
        <div class="stats">
            <span class="badge badge-mode" id="mode-label">對比模式: 待判定</span>
            <span class="badge badge-added" id="count-added">新增: 0</span>
            <span class="badge badge-modified" id="count-modified">修改: 0</span>
            <span class="badge badge-deleted" id="count-deleted">刪除: 0</span>
        </div>
        <div class="btn-group">
            <button id="btn-export-diff" disabled onclick="exportDiffJSON()">導出差異 JSON</button>
        </div>
    </div>

    <div id="result-container">
        <div class="empty-state" id="empty-state">請在上方的兩個區域上傳新舊版本的檔案進行對比</div>
    </div>
</div>

<script>
    let parsedOld = null;
    let parsedNew = null;
    let currentDiff = [];
    let compareMode = 'kv';

    setupDropZone('zone-old', 'file-old', (parsed, file) => {
        parsedOld = { parsed, name: file.name };
        renderFileInfo('info-old', file, parsed);
        checkAndCompare();
    });

    setupDropZone('zone-new', 'file-new', (parsed, file) => {
        parsedNew = { parsed, name: file.name };
        renderFileInfo('info-new', file, parsed);
        checkAndCompare();
    });

    function renderFileInfo(elementId, file, parsed) {
        let extra = '';
        if (parsed.type === 'bytes') {
            extra = `類型: .bytes | 版本: ${parsed.version} | 項目數: ${Object.keys(parsed.data).length}`;
        } else if (parsed.type === 'json') {
            extra = `類型: JSON | 平坦化 Key 總數: ${Object.keys(parsed.data).length}`;
        } else {
            extra = `類型: 純文字/其他 | 總行數: ${parsed.lines.length}`;
        }
        document.getElementById(elementId).innerHTML = `<strong>${file.name}</strong><br>${extra}`;
    }

    function setupDropZone(zoneId, inputId, callback) {
        const zone = document.getElementById(zoneId);
        const input = document.getElementById(inputId);

        zone.addEventListener('dragover', (e) => {
            e.preventDefault();
            zone.classList.add('dragover');
        });

        zone.addEventListener('dragleave', () => zone.classList.remove('dragover'));

        zone.addEventListener('drop', (e) => {
            e.preventDefault();
            zone.classList.remove('dragover');
            if (e.dataTransfer.files.length) {
                input.files = e.dataTransfer.files;
                handleFile(e.dataTransfer.files[0], callback);
            }
        });

        input.addEventListener('change', (e) => {
            if (e.target.files.length) {
                handleFile(e.target.files[0], callback);
            }
        });
    }

    // 將巢狀 JSON / 陣列轉成平坦的 Key-Value 結構 (例如 {"a.b[0].c": "val"})
    function flattenObject(obj, prefix = '') {
        let res = {};
        if (obj === null || obj === undefined) return res;

        if (typeof obj !== 'object') {
            res[prefix] = obj;
            return res;
        }

        if (Array.isArray(obj)) {
            if (obj.length === 0) {
                res[prefix] = [];
            } else {
                obj.forEach((item, index) => {
                    const p = prefix ? `${prefix}[${index}]` : `[${index}]`;
                    Object.assign(res, flattenObject(item, p));
                });
            }
            return res;
        }

        const keys = Object.keys(obj);
        if (keys.length === 0 && prefix) {
            res[prefix] = {};
            return res;
        }

        keys.forEach(k => {
            const p = prefix ? `${prefix}.${k}` : k;
            Object.assign(res, flattenObject(obj[k], p));
        });

        return res;
    }

    // 自動判斷檔案格式並解析
    function handleFile(file, callback) {
        const reader = new FileReader();

        if (file.name.endsWith('.bytes')) {
            reader.onload = function(e) {
                const buffer = new Uint8Array(e.target.result);
                const parsed = parseBytes(buffer);
                callback(parsed, file);
            };
            reader.readAsArrayBuffer(file);
        } else {
            reader.onload = function(e) {
                const text = e.target.result;
                // 嘗試解析為 JSON
                try {
                    const jsonObj = JSON.parse(text);
                    if (typeof jsonObj === 'object' && jsonObj !== null) {
                        const flatObj = flattenObject(jsonObj);
                        callback({ type: 'json', data: flatObj }, file);
                        return;
                    }
                } catch (err) {
                    // 非 JSON，當作純文字處理
                }
                
                // 當作純文字按行切分
                const lines = text.split(/\r?\n/);
                callback({ type: 'text', lines }, file);
            };
            reader.readAsText(file, 'utf-8');
        }
    }

    // Bytes 解析邏輯
    function parseBytes(uint8Array) {
        let index = 1;

        function readNumber() {
            let result = 0, offset = 0;
            while (index < uint8Array.length) {
                const byte = uint8Array[index];
                result |= (byte & 0x7f) << offset;
                index++;
                if (byte & 0x80) offset += 7;
                else break;
            }
            return result;
        }

        const dv = readNumber();
        const output = {};
        const decoder = new TextDecoder('utf-8');
        let tempContainer = [];

        while (index < uint8Array.length) {
            const datalen = readNumber();
            if (index + datalen > uint8Array.length) break;
            
            const slice = uint8Array.subarray(index, index + datalen);
            const datavalue = decoder.decode(slice);
            tempContainer.push(datavalue);
            index += datalen;

            if (tempContainer.length === 2) {
                output[tempContainer[0]] = tempContainer[1];
                tempContainer = [];
            }
        }

        return { type: 'bytes', version: dv, data: output };
    }

    // 對比發動
    function checkAndCompare() {
        if (!parsedOld || !parsedNew) return;

        const typeOld = parsedOld.parsed.type;
        const typeNew = parsedNew.parsed.type;

        // 若兩者都是 Key-Value 結構 (bytes 或 json)
        if ((typeOld === 'bytes' || typeOld === 'json') && (typeNew === 'bytes' || typeNew === 'json')) {
            compareMode = 'kv';
            document.getElementById('mode-label').innerText = '對比模式: Key-Value 對比';
            compareKeyValue(parsedOld.parsed.data, parsedNew.parsed.data);
        } else {
            // 否則採用逐行文字對比
            compareMode = 'text';
            document.getElementById('mode-label').innerText = '對比模式: 逐行文字對比';
            
            const linesOld = parsedOld.parsed.lines || textToLines(parsedOld.parsed);
            const linesNew = parsedNew.parsed.lines || textToLines(parsedNew.parsed);
            compareTextLines(linesOld, linesNew);
        }
    }

    function textToLines(parsedObj) {
        return JSON.stringify(parsedObj.data, null, 2).split('\n');
    }

    // 1. Key-Value 模式對比
    function compareKeyValue(oldData, newData) {
        const allKeys = new Set([...Object.keys(oldData), ...Object.keys(newData)]);
        currentDiff = [];
        let addedCount = 0, modifiedCount = 0, deletedCount = 0;

        allKeys.forEach(key => {
            const hasOld = key in oldData;
            const hasNew = key in newData;

            const oldVal = oldData[key];
            const newVal = newData[key];

            if (hasNew && !hasOld) {
                currentDiff.push({ type: 'added', target: key, oldVal: '', newVal });
                addedCount++;
            } else if (hasOld && !hasNew) {
                currentDiff.push({ type: 'deleted', target: key, oldVal, newVal: '' });
                deletedCount++;
            } else if (JSON.stringify(oldVal) !== JSON.stringify(newVal)) {
                currentDiff.push({ type: 'modified', target: key, oldVal, newVal });
                modifiedCount++;
            }
        });

        updateStats(addedCount, modifiedCount, deletedCount);
        renderDiffTable('Key / 欄位路徑');
    }

    // 2. 逐行文字模式對比
    function compareTextLines(linesOld, linesNew) {
        currentDiff = [];
        let addedCount = 0, modifiedCount = 0, deletedCount = 0;

        const maxLen = Math.max(linesOld.length, linesNew.length);
        for (let i = 0; i < maxLen; i++) {
            const oldVal = linesOld[i];
            const newVal = linesNew[i];

            if (oldVal === undefined && newVal !== undefined) {
                currentDiff.push({ type: 'added', target: `第 ${i + 1} 行`, oldVal: '', newVal });
                addedCount++;
            } else if (oldVal !== undefined && newVal === undefined) {
                currentDiff.push({ type: 'deleted', target: `第 ${i + 1} 行`, oldVal, newVal: '' });
                deletedCount++;
            } else if (oldVal !== newVal) {
                currentDiff.push({ type: 'modified', target: `第 ${i + 1} 行`, oldVal, newVal });
                modifiedCount++;
            }
        }

        updateStats(addedCount, modifiedCount, deletedCount);
        renderDiffTable('位置 / 行號');
    }

    function updateStats(added, modified, deleted) {
        document.getElementById('count-added').innerText = `新增: ${added}`;
        document.getElementById('count-modified').innerText = `修改: ${modified}`;
        document.getElementById('count-deleted').innerText = `刪除: ${deleted}`;
        document.getElementById('btn-export-diff').disabled = currentDiff.length === 0;
    }

    function renderDiffTable(firstColHeader) {
        const container = document.getElementById('result-container');

        if (currentDiff.length === 0) {
            container.innerHTML = `<div class="empty-state">比對完成：兩份檔案內容完全一致，無任何差異！</div>`;
            return;
        }

        let html = `
            <table class="result-table">
                <thead>
                    <tr>
                        <th style="width: 10%;">類型</th>
                        <th style="width: 30%;">${firstColHeader}</th>
                        <th style="width: 30%;">舊版內容 (Old)</th>
                        <th style="width: 30%;">新版內容 (New)</th>
                    </tr>
                </thead>
                <tbody>
        `;

        currentDiff.forEach(item => {
            let typeLabel = '';
            let rowClass = '';

            if (item.type === 'added') {
                typeLabel = '新增 (Add)';
                rowClass = 'row-added';
            } else if (item.type === 'modified') {
                typeLabel = '修改 (Mod)';
                rowClass = 'row-modified';
            } else if (item.type === 'deleted') {
                typeLabel = '刪除 (Del)';
                rowClass = 'row-deleted';
            }

            html += `
                <tr class="${rowClass}">
                    <td><strong>${typeLabel}</strong></td>
                    <td>${escapeHtml(String(item.target))}</td>
                    <td>${escapeHtml(formatVal(item.oldVal))}</td>
                    <td>${escapeHtml(formatVal(item.newVal))}</td>
                </tr>
            `;
        });

        html += `</tbody></table>`;
        container.innerHTML = html;
    }

    function formatVal(val) {
        if (val === undefined || val === '') return '';
        if (typeof val === 'object') return JSON.stringify(val);
        return String(val);
    }

    function exportDiffJSON() {
        if (!currentDiff.length) return;

        const exportData = {
            metadata: {
                oldFile: parsedOld.name,
                newFile: parsedNew.name,
                compareMode: compareMode,
                exportedAt: new Date().toISOString()
            },
            diff: currentDiff
        };

        const blob = new Blob([JSON.stringify(exportData, null, 4)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `diff-${parsedOld.name}-vs-${parsedNew.name}.json`;
        a.click();
        URL.revokeObjectURL(url);
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }
</script>

</body>
</html>
