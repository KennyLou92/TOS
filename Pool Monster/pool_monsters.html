<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lucky Draw Pool Monsters</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#1d2129;--sub:#6b7280;--border:#dfe3e8}
@media (prefers-color-scheme:dark){:root{--bg:#16181d;--card:#22252c;--text:#e8eaed;--sub:#9aa0a6;--border:#383c45}}
*{box-sizing:border-box}
body{margin:0;padding:16px;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:16px}
select,input{font-size:16px;padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text)}
select{min-width:260px;max-width:100%}
#count{color:var(--sub)}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px}
.item{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:8px 4px;text-align:center;cursor:pointer}
.item img{width:72px;height:72px;display:block;margin:0 auto 4px;border-radius:8px;background:var(--border)}
.item span{font-size:13px;font-variant-numeric:tabular-nums}
.item.copied{outline:2px solid #3b82f6}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:8px 14px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <select id="pool"></select>
  <button id="copyAll" style="font-size:16px;padding:8px 12px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer">複製全部 ID</button>
  <span id="count"></span>
  <input type="file" id="file" accept=".json,application/json" style="display:none">
</header>
<div id="grid"></div>
<div id="toast"></div>
<script>
let DATA={};
const pad=id=>String(id).padStart(4,"0");
const BASE="https://d1h5mn9kk900cf.cloudfront.net/toswebsites/gallery/icons/";
const sel=document.getElementById("pool"),grid=document.getElementById("grid"),count=document.getElementById("count"),toast=document.getElementById("toast");
function load(json){
  DATA={};
  (json.data||[]).forEach(p=>{DATA[p.poolId]=(p.monsterRates||[]).map(m=>pad(m.monsterId))});
  sel.innerHTML="";
  Object.keys(DATA).forEach(k=>{const o=document.createElement("option");o.value=k;o.textContent=k+" ("+DATA[k].length+")";sel.appendChild(o)});
  fileIn.style.display="none";
  render();
}
const fileIn=document.getElementById("file");
fileIn.onchange=()=>{const f=fileIn.files[0];if(!f)return;f.text().then(t=>load(JSON.parse(t))).catch(e=>count.textContent="JSON 讀取失敗："+e.message)};
function say(t){toast.textContent=t;toast.classList.add("show");clearTimeout(say.t);say.t=setTimeout(()=>toast.classList.remove("show"),1200)}
function copy(t){(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>say("已複製 "+t),()=>{const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();try{document.execCommand("copy");say("已複製 "+t)}catch(e){}a.remove()})}
function render(){
  const ids=DATA[sel.value]||[];
  count.textContent="共 "+ids.length+" 隻";
  grid.innerHTML="";
  ids.forEach(id=>{
    const d=document.createElement("div");d.className="item";
    const img=document.createElement("img");img.loading="lazy";img.src=BASE+id+".jpg";img.alt=id;
    const s=document.createElement("span");s.textContent=id;
    d.append(img,s);d.onclick=()=>copy(String(id));grid.appendChild(d);
  });
}
sel.onchange=render;
document.getElementById("copyAll").onclick=()=>copy((DATA[sel.value]||[]).join(","));
fetch("luckyDrawPoolMonster.json").then(r=>{if(!r.ok)throw 0;return r.json()}).then(load).catch(()=>{
  count.textContent="無法自動載入 luckyDrawPoolMonster.json，請手動選擇檔案：";
  fileIn.style.display="";
});
</script>
</body>
</html>
